<!DOCTYPE html>
<html lang="ar" dir="rtl" x-data="coachHubApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachHub - منصة إدارة تدريبات الجيم</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white" :dir="lang === 'ar' ? 'rtl' : 'ltr'">

    <!-- Navbar -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-gradient-to-tr from-emerald-600 to-teal-600 text-white p-3 rounded-2xl shadow-lg shadow-emerald-500/20 text-xl">
                    <i class="fa-solid fa-dumbbell"></i>
                </div>
                <div>
                    <span class="text-2xl font-black tracking-wider bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">CoachHub</span>
                    <span class="block text-xs text-slate-400 font-medium" x-text="lang === 'ar' ? 'منصة إدارة تدريبات الجيم' : 'Gym Training Platform'"></span>
                </div>
            </div>
            
            <div class="flex items-center space-x-4 space-x-reverse">
                <button @click="toggleLang()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3.5 py-2 rounded-xl border border-slate-700 transition font-bold flex items-center gap-2">
                    <i class="fa-solid fa-globe"></i>
                    <span x-text="lang === 'ar' ? 'English' : 'عربي'"></span>
                </button>
                <button @click="currentView = 'admin'" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-4 py-2 rounded-xl font-bold transition">
                    <i class="fa-solid fa-user-shield ml-1"></i> <span x-text="lang === 'ar' ? 'لوحة التحكم' : 'Admin Panel'"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow">
        <!-- Landing / Pricing Section -->
        <template x-if="currentView === 'home'">
            <div class="py-16 max-w-7xl mx-auto px-4">
                <div class="text-center max-w-3xl mx-auto mb-16">
                    <span class="inline-flex items-center gap-1.5 py-1.5 px-4 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mb-6">
                        <i class="fa-solid fa-fire"></i> <span x-text="lang === 'ar' ? 'اختر باقة التدريب الخاصة بك' : 'Choose Your Training Plan'"></span>
                    </span>
                    <h1 class="text-4xl sm:text-5xl font-black tracking-tight mb-6" x-text="lang === 'ar' ? 'ارتقِ بمستوى متدربيك وحقق أهدافك الرياضية' : 'Elevate Your Training & Reach Your Goals'"></h1>
                    <p class="text-slate-400 text-lg" x-text="lang === 'ar' ? 'نظام متكامل لإدارة علاقة مدربي الجيم بالمتدربين، مع 7 مستويات اشتراك مرنة والدفع عبر إنستاباي.' : 'Integrated system for gym trainers and clients with 7 flexible tiers and InstaPay.'"></p>
                </div>

                <!-- 7-Tier Pricing Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <template x-for="tier in pricingTiers" :key="tier.id">
                        <div class="bg-slate-900 rounded-3xl p-6 border border-slate-800 hover:border-emerald-500/50 transition flex flex-col justify-between relative group">
                            <div class="absolute -top-3 right-6 bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow" x-text="tier.nameAr"></div>
                            <div>
                                <h3 class="text-xl font-bold mb-2 mt-2" x-text="lang === 'ar' ? tier.nameAr : tier.nameEn"></h3>
                                <p class="text-slate-400 text-xs mb-6" x-text="lang === 'ar' ? tier.descAr : tier.descEn"></p>
                            </div>
                            <div>
                                <div class="flex items-baseline mb-6 pt-4 border-t border-slate-800">
                                    <span class="text-3xl font-black text-emerald-400" x-text="tier.price"></span>
                                    <span class="text-xs text-slate-400 mr-1" x-text="lang === 'ar' ? ' ج.م / شهرياً' : ' EGP / mo'"></span>
                                </div>
                                <button @click="selectTier(tier)" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition text-sm shadow-md shadow-emerald-600/20" x-text="lang === 'ar' ? 'اشترك الآن' : 'Subscribe Now'"></button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Admin / Trainer Dashboard View -->
        <template x-if="currentView === 'admin'">
            <div class="max-w-7xl mx-auto px-4 py-10">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-black" x-text="lang === 'ar' ? 'لوحة تحكم المدربين والمتدربين' : 'Trainer & Client Dashboard'"></h2>
                    <button @click="currentView = 'home'" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-xs font-bold">
                        <i class="fa-solid fa-arrow-right ml-1"></i> <span x-text="lang === 'ar' ? 'العودة للرئيسية' : 'Back to Home'"></span>
                    </button>
                </div>
                
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                    <h3 class="text-lg font-bold mb-4" x-text="lang === 'ar' ? 'إدارة الاشتراكات والتحقق من InstaPay' : 'Subscriptions & InstaPay Verification'"></h3>
                    <p class="text-slate-400 text-sm mb-6" x-text="lang === 'ar' ? 'حساب إنستاباي المعتمد للإيداع: 01221078181' : 'Verified InstaPay Account: 01221078181'"></p>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-right text-sm">
                            <thead>
                                <tr class="border-b border-slate-800 text-slate-400">
                                    <th class="py-3 px-4">المتدرب</th>
                                    <th class="py-3 px-4">الباقة</th>
                                    <th class="py-3 px-4">المبلغ</th>
                                    <th class="py-3 px-4">الحالة</th>
                                    <th class="py-3 px-4">تواصل واتساب</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="sub in subscriptions" :key="sub.id">
                                    <tr class="border-b border-slate-800/50">
                                        <td class="py-3 px-4 font-bold" x-text="sub.name"></td>
                                        <td class="py-3 px-4 text-emerald-400" x-text="sub.tier"></td>
                                        <td class="py-3 px-4" x-text="sub.price"></td>
                                        <td class="py-3 px-4">
                                            <span class="px-2.5 py-1 rounded-full text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20" x-text="sub.status"></span>
                                        </td>
                                        <td class="py-3 px-4">
                                            <a :href="'https://wa.me/201221078181?text=' + encodeURIComponent('مرحباً، أتابع بخصوص اشتراك ' + sub.tier)" target="_blank" class="text-emerald-400 hover:text-emerald-300 font-bold">
                                                <i class="fa-brands fa-whatsapp text-lg"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- Checkout Modal -->
    <div x-show="showModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" style="display: none;">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-8 shadow-2xl relative">
            <button @click="showModal = false" class="absolute top-6 left-6 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-emerald-600/20 text-emerald-400 rounded-2xl flex items-center justify-center text-xl font-bold mx-auto mb-3">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <h3 class="text-xl font-bold" x-text="selectedTier?.nameAr"></h3>
                <p class="text-emerald-400 font-bold text-lg mt-1" x-text="selectedTier?.price + ' ج.م'"></p>
            </div>

            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 mb-6 text-sm">
                <p class="text-slate-300 mb-2 font-semibold">تعليمات الدفع عبر InstaPay:</p>
                <ol class="list-decimal list-inside text-slate-400 space-y-1.5 text-xs">
                    <li>افتح تطبيق إنستاباي.</li>
                    <li>حول المبلغ إلى الحساب المعتمد: <strong class="text-emerald-400 font-mono">01221078181</strong></li>
                    <li>أرسل إيصال التحويل عبر واتساب لتفعيل الحساب فوراً.</li>
                </ol>
            </div>

            <div class="flex gap-3 mb-4">
                <input type="text" readonly value="01221078181" id="instapayAcc" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-center flex-grow font-mono text-emerald-300 focus:outline-none">
                <button @click="navigator.clipboard.writeText('01221078181'); alert('تم النسخ!');" class="bg-slate-800 hover:bg-slate-700 px-4 py-3 rounded-xl text-sm font-bold transition">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>

            <button @click="confirmSubscription()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/20">
                <i class="fa-brands fa-whatsapp ml-2"></i> تأكيد وإرسال الإيصال عبر واتساب
            </button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        function coachHubApp() {
            return {
                lang: 'ar',
                currentView: 'home',
                showModal: false,
                selectedTier: null,
                pricingTiers: [
                    { id: 1, nameAr: 'المستوى الأساسي', nameEn: 'Basic Tier', descAr: 'برنامج تدريبي عام ومتابعة شهرية خفيفة', descEn: 'General workout plan & monthly review', price: '200' },
                    { id: 2, nameAr: 'المستوى البرونزي', nameEn: 'Bronze Tier', descAr: 'جدول تمارين مخصص للمبتدئين', descEn: 'Custom beginner workout routine', price: '500' },
                    { id: 3, nameAr: 'المستوى الفضي', nameEn: 'Silver Tier', descAr: 'برنامج تمارين وتغذية متكامل', descEn: 'Full workout & nutrition program', price: '800' },
                    { id: 4, nameAr: 'المستوى الذهبي', nameEn: 'Gold Tier', descAr: 'متابعة أسبوعية مباشرة وتعديل مستمر', descEn: 'Direct weekly check-ins & adjustments', price: '1200' },
                    { id: 5, nameAr: 'المستوى البلاتيني', nameEn: 'Platinum Tier', descAr: 'تدريب مكثف وتواصل دائم عبر واتساب', descEn: 'Intensive coaching & continuous WhatsApp support', price: '1600' },
                    { id: 6, nameAr: 'المستوى الماسي', nameEn: 'Diamond Tier', descAr: 'خطط احترافية متقدمة وتعديل وجبات فوري', descEn: 'Advanced professional plans & instant meal updates', price: '2000' },
                    { id: 7, nameAr: 'المستوى الاحترافي الشامل', nameEn: 'Elite VIP Tier', descAr: 'متابعة VIP كاملة على مدار الساعة مع الخبير', descEn: 'Full 24/7 VIP coaching with the expert', price: '2500' }
                ],
                subscriptions: [
                    { id: 1, name: 'أحمد محمود', tier: 'المستوى الذهبي', price: '1200 ج.م', status: 'مؤكد' },
                    { id: 2, name: 'محمود علي', tier: 'المستوى الفضي', price: '800 ج.م', status: 'قيد المراجعة' }
                ],
                toggleLang() {
                    this.lang = this.lang === 'ar' ? 'en' : 'ar';
                },
                selectTier(tier) {
                    this.selectedTier = tier;
                    this.showModal = true;
                },
                confirmSubscription() {
                    const msg = `مرحباً، أرغب في الاشتراك في "${this.selectedTier.nameAr}" بقيمة ${this.selectedTier.price} ج.م عبر إنستاباي. وهذا هو الإيصال.`;
                    window.open(`https://wa.me/201221078181?text=` + encodeURIComponent(msg), '_blank');
                }
            }
        }
    </script>
</body>
</html>
