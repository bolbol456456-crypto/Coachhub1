<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachHub Pro - انضمام المدربين الآمن</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD-Secure-Placeholder-Key",
            authDomain: "coachhub-pro.firebaseapp.com",
            projectId: "coachhub-pro",
            storageBucket: "coachhub-pro.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.db = db;
        window.storage = storage;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.ref = ref;
        window.uploadBytes = uploadBytes;
        window.getDownloadURL = getDownloadURL;
    </script>

    <style>
        body { font-family: 'Cairo', sans-serif; }
        .hero-gym-bg {
            background: linear-gradient(rgba(3, 7, 18, 0.85), rgba(3, 7, 18, 0.95)), 
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
        }
        .card-gym-glow {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen hero-gym-bg flex items-center justify-center p-4">

    <div class="card-gym-glow border border-slate-800 p-6 rounded-3xl max-w-lg w-full shadow-2xl space-y-6" dir="rtl">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-500 text-slate-950 p-2.5 rounded-2xl font-black text-lg"><i class="fa-solid fa-dumbbell"></i></div>
                <h1 class="text-xl font-black text-white">Coach<span class="text-emerald-400">Hub</span></h1>
            </div>
            <span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30">بوابة الكوتش الجديدة</span>
        </div>

        <!-- الخطوة 1: لوحة التحكم - زر انضم كوتش -->
        <div id="step-dashboard" class="space-y-4 text-center py-4">
            <div class="w-16 h-16 bg-blue-500/10 text-blue-400 rounded-3xl flex items-center justify-center text-3xl mx-auto mb-2 border border-blue-500/20">
                <i class="fa-solid fa-user-tie"></i>
            </div>
            <h2 class="text-2xl font-black text-white">لوحة تحكم الكوتش</h2>
            <p class="text-slate-400 text-xs leading-relaxed">انضم الآن إلى منصة التدريب الذكية، وحدد سعرك الشهري وابدأ استقبال المتدربين بكل سهولة.</p>
            <button onclick="goToPaymentStep()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black py-3.5 rounded-2xl transition shadow-lg shadow-blue-500/20">
                انضم كوتش جديد للمنصة
            </button>
        </div>

        <!-- الخطوة 2: صفحة الاشتراك الشهري (300 جنيه) -->
        <div id="step-payment" class="hidden space-y-4 text-center py-2">
            <div class="w-16 h-16 bg-amber-500/10 text-amber-400 rounded-3xl flex items-center justify-center text-3xl mx-auto mb-2 border border-amber-500/20">
                <i class="fa-solid fa-credit-card"></i>
            </div>
            <h2 class="text-xl font-black text-white">رسوم الاشتراك الشهري</h2>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-1">
                <p class="text-xs text-slate-400">قيمة الاشتراك لتفعيل حسابك كمدرب معتمد:</p>
                <div class="text-emerald-400 text-2xl font-black">300 جنيه مصري</div>
            </div>
            <button onclick="confirmPaymentStep()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-black py-3.5 rounded-2xl transition shadow-lg shadow-amber-500/20">
                إتمام الدفع والانتقال للتسجيل
            </button>
        </div>

        <!-- الخطوة 3: نموذج التسجيل (Gmail، الكود، رفع الصورة من الهاتف) -->
        <div id="step-register" class="hidden space-y-4">
            <h2 class="text-lg font-black text-white flex items-center gap-2">
                <i class="fa-solid fa-id-card text-emerald-400"></i> بيانات بروفايل الكوتش
            </h2>
            
            <form id="coachRegistrationForm" onsubmit="submitCoachData(event)" class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">البريد الإلكتروني (Gmail):</label>
                    <input type="email" id="reg-email" placeholder="coach@gmail.com" required class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-xs text-slate-400 block mb-1">كود التفعيل (المتفق عليه):</label>
                    <input type="text" id="reg-code" placeholder="أدخل كود التحقق" required class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm text-white outline-none focus:border-emerald-500 font-mono tracking-widest">
                </div>

                <div>
                    <label class="text-xs text-slate-400 block mb-1">اسم الكوتش الكامل:</label>
                    <input type="text" id="reg-name" placeholder="مثال: كابتن محمد نبيل" required class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-xs text-slate-400 block mb-1">تحديد سعرك الشهري (بالدولار):</label>
                    <input type="number" id="reg-price" placeholder="مثال: 90$" required class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm text-emerald-400 font-bold outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-xs text-slate-400 block mb-1">صورة البروفيل الشخصية (تحميل مباشر من الهاتف):</label>
                    <input type="file" id="reg-image-file" accept="image/*" required class="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-300 file:bg-emerald-500 file:text-slate-950 file:border-0 file:py-2 file:px-4 file:rounded-lg file:font-bold file:cursor-pointer">
                </div>

                <div>
                    <label class="text-xs text-slate-400 block mb-1">السيرة الذاتية (نبذة عن خبرتك):</label>
                    <textarea id="reg-bio" rows="2" placeholder="اكتب نبذة مختصرة عن تخصصك وخبرتك..." required class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm text-white outline-none focus:border-emerald-500"></textarea>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-sm transition shadow-lg shadow-emerald-500/20">
                    تأكيد التسجيل وإنشاء البروفايل السحابي
                </button>
            </form>
        </div>

    </div>

    <!-- JavaScript Actions -->
    <script>
        function goToPaymentStep() {
            document.getElementById('step-dashboard').classList.add('hidden');
            document.getElementById('step-payment').classList.remove('hidden');
        }

        function confirmPaymentStep() {
            alert("تم إتمام دفع رسوم الاشتراك بنجاح (300 جنيه). تفضل بإدخال بيانات بروفايلك.");
            document.getElementById('step-payment').classList.add('hidden');
            document.getElementById('step-register').classList.remove('hidden');
        }

        async function submitCoachData(event) {
            event.preventDefault();
            
            const email = document.getElementById('reg-email').value.trim();
            const code = document.getElementById('reg-code').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const price = document.getElementById('reg-price').value.trim();
            const bio = document.getElementById('reg-bio').value.trim();
            const imageFile = document.getElementById('reg-image-file').files[0];

            if(!imageFile) {
                alert('يرجى اختيار صورة بروفيل من الهاتف.');
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = "جاري رفع الصورة وحفظ البيانات...";
            btn.disabled = true;

            try {
                // 1. رفع الصورة المباشرة من الهاتف إلى سحابة التخزين (Firebase Storage)
                const storageRef = window.ref(window.storage, `coaches_profiles/${Date.now()}_${imageFile.name}`);
                const snapshot = await window.uploadBytes(storageRef, imageFile);
                const downloadURL = await window.getDownloadURL(snapshot.ref);

                // 2. حفظ بيانات الكوتش كاملة في قاعدة البيانات (Firestore)
                await window.addDoc(window.collection(window.db, "coaches"), {
                    email: email,
                    code: code,
                    name: name,
                    price: `${price}$`,
                    img: downloadURL, // رابط الصورة الناتج عن الرفع المباشر
                    bio: bio,
                    active: true,
                    createdAt: new Date().toISOString()
                });

                alert('تم تسجيل الكوتش وإنشاء البروفايل بنجاح وربط الصورة من الهاتف!');
                location.reload();
            } catch (error) {
                console.error(error);
                alert('حدث خطأ أثناء الاتصال بالقاعدة السحابية، يرجى المحاولة مرة أخرى.');
                btn.innerText = "تأكيد التسجيل وإنشاء البروفايل السحابي";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
